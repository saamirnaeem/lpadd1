<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Predictor: Jeju SK vs Bayern Munich</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans flex flex-col min-h-screen">

    <!-- 🟢 AD CONTAINER: Header (e.g., ylliX or Adsterra 728x90) -->
    <div class="w-full bg-white text-center py-4 shadow-sm border-b border-gray-200">
        <p class="text-xs text-gray-400 mb-1">Advertisement</p>
        <!-- APNE AD NETWORK KA SCRIPT TAG YAHAN PASTE KAREIN 👇 -->
        <div id="header-ad" class="h-16 w-full max-w-3xl mx-auto bg-gray-200 flex items-center justify-center text-gray-500 text-sm">
            Ad Space (Leaderboard)
        </div>
    </div>

    <!-- Main Content Area -->
    <main class="flex-grow flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-lg p-6 w-full max-w-md text-center">
            <h1 class="text-2xl font-bold text-red-600 mb-2">LIVE MATCH POLL</h1>
            <p class="text-sm text-gray-500 mb-6">Audi Summer Tour 2026: Jeju SK vs FC Bayern</p>

            <h2 class="text-lg font-semibold mb-4">Who will win the match?</h2>

            <!-- Voting Buttons -->
            <div id="poll-container" class="space-y-3">
                <button onclick="castVote('Bayern')" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-4 rounded transition duration-200 shadow-sm">
                    FC Bayern Munich
                </button>
                <button onclick="castVote('Draw')" class="w-full bg-gray-500 hover:bg-gray-600 text-white font-bold py-3 px-4 rounded transition duration-200 shadow-sm">
                    Draw
                </button>
                <button onclick="castVote('Jeju')" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 px-4 rounded transition duration-200 shadow-sm">
                    Jeju SK FC
                </button>
            </div>

            <!-- Results Display (Hidden until voted) -->
            <div id="results-container" class="hidden mt-6">
                <h3 class="font-bold text-gray-700 mb-3">Current Results:</h3>
                <div class="text-left text-sm space-y-3">
                    
                    <div>
                        <p class="mb-1">Bayern Munich: <span class="float-right font-bold">78%</span></p>
                        <div class="w-full bg-gray-200 rounded-full h-2.5">
                            <div class="bg-red-600 h-2.5 rounded-full" style="width: 78%"></div>
                        </div>
                    </div>
                    
                    <div>
                        <p class="mb-1">Draw: <span class="float-right font-bold">12%</span></p>
                        <div class="w-full bg-gray-200 rounded-full h-2.5">
                            <div class="bg-gray-500 h-2.5 rounded-full" style="width: 12%"></div>
                        </div>
                    </div>
                    
                    <div>
                        <p class="mb-1">Jeju SK: <span class="float-right font-bold">10%</span></p>
                        <div class="w-full bg-gray-200 rounded-full h-2.5">
                            <div class="bg-orange-500 h-2.5 rounded-full" style="width: 10%"></div>
                        </div>
                    </div>

                </div>
                <p class="text-sm text-green-600 mt-5 font-semibold">Thank you for your prediction!</p>
            </div>
        </div>
    </main>

    <!-- 🟢 AD CONTAINER: Footer (e.g., Monetag Native or Adsterra 320x50) -->
    <div class="w-full bg-white text-center py-4 shadow-sm border-t border-gray-200">
        <p class="text-xs text-gray-400 mb-1">Advertisement</p>
        <!-- APNE AD NETWORK KA SCRIPT TAG YAHAN PASTE KAREIN 👇 -->
        <div id="footer-ad" class="h-16 w-full max-w-3xl mx-auto bg-gray-200 flex items-center justify-center text-gray-500 text-sm">
            Ad Space (Banner)
        </div>
    </div>

    <!-- JavaScript for Interaction -->
    <script>
        function castVote(team) {
            // Hide the buttons
            document.getElementById('poll-container').classList.add('hidden');
            // Show the mock results
            document.getElementById('results-container').classList.remove('hidden');
            
            // Optional: You can route this data to Firebase Firestore here if you want to track real votes
            console.log("User prediction recorded:", team);
        }
    </script>
</body>
</html>
